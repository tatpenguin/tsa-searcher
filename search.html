erence to the competition. • The relations between main points and supporting points generally clear. • Cohesive ties used generally enhance coherence although these may occasionally be fuzzy. 0 • Overall coherence of email is weak. • The relations between main points and supporting points generally not clear. • Cohesive ties used contribute little to the"],["eng","dse","答案",37,"只限教師參閱 FOR TEACHERS’ USE ONLY Task 10: Language = 5 marks See the table on page 13. Task 10: Coherence and Organization = 2 marks Marks Coherence and Organization 2 • Overall coherence of article very good. • Includes a title which is informative and congruent with rest of article. • Includes ending that rounds off article in a satisfying way. • The relations between main points and supporting points always clear. • Strong cohesive ties used to enhance coherence when necessary. 1 • Overall coherence of article is reasonable. • Includes a title which is generally congruent with rest of article. • Includes relevant and coherent ending. • The relations between main points and supporting points generally clear. • Cohesive ties used generally enhance coherence although these may occasionally be fuzzy. 0 • Overall coherence of article is weak. • The relations between main points and supporting"],["eng","dse","答案",38,"只限教師參閱 FOR TEACHERS’ USE ONLY 香港考試及評核局 HONG KONG EXAMINATIONS AND ASSESSMENT AUTHORITY 香港中學文憑考試 HONG KONG DIPLOMA OF SECONDARY EDUCATION EXAMINATION 練習卷 PRACTICE PAPER ENGLISH LANGUAGE PAPER 3 錄音稿 Tapescript 本錄音稿乃香港考試及評核局專爲上述試卷編寫，只供錄音帶製作 興閱卷員參考之用。在評閱上述試卷時，一切考慮仍以錄音帶之內 容為準。 This tapescript has been prepared by the Hong Kong Examination and Assessment Authority for recording the examination tape and for markers’ reference. However, the marking of examination scripts is based on the recording rather then the tapescript.  香港考試及評核局 保留版權 Hong Kong Examinations and Assessment Authority All Rights Reserved 2012 PP-DSE-ENG LANG 3-TS"],["eng","dse","答案",39,"Hong Kong Diploma of Secondary Education Practice Paper English Language Paper 3 Announcer: Tapescript Hong Kong Diploma of Secondary Education, English Language Practice Paper 3, Integrated Listening, Reading and Writing. Instructions to Candidates. You should have on your desk a Part A Question-Answer Book, a Part B1 Data File with a Part B1 Question-Answer Book inserted and a Part B2 Data File with a Part B2 Question-Answer Book inserted. Do not open them until you are told to do so. I repeat, do not open the Question-Answer Books or the Data Files until you are told to do so. Now write your Candidate Number in the space provided on Page 1 of your Part A Question-Answer Book. (10 seconds pause) Now look at the Part A Question-Answer Book. Check that the Part A Question-Answer Book has no missing pages. Look for the words ‘End of Part A’ on the last page. (10 seconds pause) Now stick y"],["eng","dse","答案",40,"Now look at your Part B2 Data File. Take out the inserted Part B2 Question-Answer Book. Check that the Part B2 Data File has no missing pages. Look for the words ‘This is the last page of the Part B2 Data file’ on the last page. (10 seconds pause) Now look at your Part B2 Question-Answer Book. Check that the Part B2 Question-Answer Book has no missing pages. Look for the words ‘End of Part B2’ on the last page. (10 seconds pause) Now stick your barcode labels in the spaces provided on Pages 1 and 3. Close the Part B2 Question-Answer Book when you have finished. (30 seconds of Greensleeves) You are reminded that all examination materials will be played ONCE only. The test is divided into two parts: Part A and Part B. You should use a pencil to answer all questions in Part A. For Part B, you can use a pen or a pencil. Put up your hand now if you have any difficulties. It is not possible to"],["eng","dse","答案",41,"Announcer: Part A. Situation. You are Sam, a Secondary 6 student at Regent College. You are a member of a group of four classmates – you, Aaron, George and Lucy – who are doing a school project on weight problems in children in Hong Kong. In Part A, you will have a total of four tasks to do. Follow the instructions in the Question-Answer Book and in the recording to complete the tasks. You will find all the information you need in the Question-Answer Book and the recording. You now have two minutes to familiarize yourself with Tasks 1 - 4. (2 minutes of Greensleeves) (Tone) Task 1 is about to begin. Task 1. You and one of the group members, Aaron, are discussing your plans for the project. Listen to the conversation and fill in the information sheet below. Two have been done for you as examples. You now have 30 seconds to study the note headings. At the end of the task, you will have one"],["eng","dse","答案",42,"Sam: Yeah. Monday… The 30th, I think it is. Aaron: The deadline for the project’s the 10th of February. So we’ve got 3 weeks to do it. Sam: Yeah. There’s a lot we – I mean there’s a lot to do before the 10th. Aaron: Mmm. Sam: I dunno, I think we should start with the information collection. Aaron: The what? Sam: You know, the information collection. Collecting all the information and stuff for the introduction…the background… Aaron: What? From the Internet or? Sam: Yeah. I think the Internet’s the obvious place to start. You could just do a google search. Mind you we’d have to limit ourselves a bit. There’s just going to be too much stuff. Aaron: Yeah, true. It’s meant to be on Hong Kong. Erm, there’ll be enough if we just search Hong Kong websites I’m sure. Sam: OK, so how long do you think we should spend on that? On Hong Kong websites. Aaron: Maybe a day, maybe a bit longer. Sam: Yeah"],["eng","dse","答案",43,"Sam: Yeah, what I was thinking was, you know how George lives really near the Central Library? Aaron: Yeah. Sam: Well, he could go there – to Central Library at the weekend. No problem. And that would take him – what – four hours or something like that. Aaron: Yeah good idea. We can put down four hours for George in the Central Library but what’s that got to do with the school library? Sam: Well, George would be the best person to come with me ‘cause he’d know what he’s found at the Central Library already. Aaron: Oh, OK. What? Instead of me? Sam: Yeah, exactly. Instead of you on Tuesday. Then you can go to your choir practice. I’ll let George know. There isn’t much in there so I’ll write two hours in the plan then. Fine. Is that it then? Aaron: Nah. We’re going to need more than that. Sam: Like what? Aaron: Well, I was thinking. Isn’t Lucy’s father a doctor? Sam: Yeah. I think so. Yeah."],["eng","dse","答案",44,"Sam: Mm. Aaron: Right. So is that us done? Sam: No, we’ve still to decide who does what. I mean the writing. Who’s going to write what…erm… Aaron: Oh yeah. Sam: Well, maybe I can write the introduction and background. Aaron: Mm. Sam: I mean, I’ll have done all the collecting the information and stuff by then, so… Aaron: OK, but you can’t just choose the easiest bit yourself! Sam: What? Aaron: I mean, the results section. That’s much more work and I can’t finish it on my own! Sam: OK OK. Right well, we can do the results part together, if you like. You and me. Aaron: Mmm. Sam: OK? Aaron: Yeah, OK. But what about George and Lucy? I mean… Sam: Well, we can get them to do the conclusions and recommendations. That should keep them busy. Aaron: Fine. Sam: I think we should put here – in the action plan – How long to give us to do the write up. Aaron: Mmm. Let’s put ten days. Sam: OK. Right wel"],["eng","dse","答案",45,"Announcer: Task 2. As part of your research into weight problems in children in Hong Kong, you have found a podcast that you think will provide you with useful information. Now you will play the podcast to your group members. Listen and complete the note sheet below. One has been done for you as an example. You now have 30 seconds to study the note sheet. At the end of the task, you will have one and a half minutes to tidy up your answers. (30 seconds of Greensleeves) (Tone) Sam: Hi guys, how’s the research going? Aaron: Oh, OK. How about you? Sam: Well, I’ve found this really good podcast on the government website. Lucy: Really? Sam: Yeah. It’s really good. It’s all about obesity and children in Hong Kong. Lucy: Great. Can we listen to it now? To hear what it says. Sam: Yeah, I’ve only listened to it once. I haven’t taken any notes off it. So we could jot down the main points as we list"],["eng","dse","答案",46,"Sam: Sorry for stopping it. I missed the definition. Did anybody else get it? Aaron: Yeah. It said obesity’s when the body stores too much fat. Sam: OK, got it. Right. I’ll start it again. Hold on. I’ll put it back a bit. (Sound of 3 mouse clicks) Dr Benko: Now you may ask just how much fat is too much. Well, this is different for boys and for girls as their bodies, as you no doubt realize, are different. The figures we generally use are different for boys and girls when we’re deciding if they’re obese or not. For boys, if more than 25% of their body is made up of fat, then they’re considered to be obese. The figure for girls is higher, at 32%. So boys are obese if more than a quarter of their body is fat and for girls it’s nearly a third. Interviewer: OK. Interesting… Now, I read the other day that top athletes can have as little as 5% body fat. But what I want to know is how do we know"],["eng","dse","答案",47,"Dr Benko: Well, there are four common effects of obesity. The first is high blood pressure – the body has to work a lot harder and so the blood pressure goes up. The second also involves the blood as we find that people with obesity have high cholesterol… Interviewer: Yes, there’s a lot more public awareness about levels of cholesterol these days. Dr Benko: Yes, the other two are more related to how people feel about themselves, if they’re obese. The first of these is that they can suffer from low self-esteem and that can often lead to depression. Interviewer: Hmm…the last one – that obesity leads to depression – certainly reflects my own experience growing up. I’m sure we all remember how the overweight kids at school were laughed at by their classmates. It is very easy to imagine how those cases lead to problems of low self-esteem and depression. Dr. Benko: Yes, in many ways it’s these"],["eng","dse","答案",48,"Announcer: Task3. Your group mate Aaron has found some information which may be useful to the project and he is now telling you about this. Complete the flow chart below while Aaron explains. You now have 30 seconds to study the flow chart. At the end of the task, you will have one minute to tidy up your answers. (30 seconds of Greensleeves) (Tone) Aaron: Hey, I was going to say, when I was doing that research for the project, I found this really good guide. Sam: Oh yeah? Aaron: Yeah, it was published by the Hospital Authority or somebody. It’s a guide for the the clinical management of weight in children. Sam: Right. So… Aaron: What it is, is like a practical summary for doctors. Basically… It’s a guide and basically consists of 6 steps. Sort of covering the whole medical process. Sam: For what? Aaron: For doctors dealing with obesity in children. Sam: Oh, OK. Aaron: Look. Maybe what we"],["eng","dse","答案",49,"Sam: Step 2. Aaron: Yeah. Now Step 2 is to examine the weight history of the child and his or her immediate family. Sam: Mmm. Aaron: Actually, it’s examining the weight history plus the medical history as well. Sam: OK…so let me make sure I’ve got this right. Have a look at my chart so far. Aaron: Oh, nice. Sam: Thank you. Now, on the right hand side of the chart we have what happens to children who are normal weight. Aaron: Yep. Sam: And on the left the…the overweight kids. Now, they are the ones – I’m imagining who follow Steps 2 to 6. Aaron: Yeah. But you haven’t finished what you were writing for Step 2. Sam: I know, I know. So Step 2. Weight history and… Aaron: Medical history. Sam: Oh yeah, medical history. Of the child and the immediate family. Aaron: OK, next is Step 3…assess eating and exercise habits of the child and parents. Sam: Oh, so eating and exercise habits of parents. A"],["eng","dse","答案",50,"Aaron: Oh no, they do. They give three. Basically, treatment strategies are things like, say, the child has to reduce his energy intake, as well as modify eating and activity behaviour. Sam: And the third one? Aaron: The third strategy is to involve the family in the process. Lucy: Yeah, I’ve been reading about this as well. And they all say that a child’s living habits – you know, what he does and his attitudes to stuff like diet and exercise. It’s really affected by his family. So involving the family is important. Aaron: Right. So then we go on to Step 5. OK, Step 5, a reassessment of the extent to which the child is overweight. Sam: That’s too much to write. Aaron: Well, just write ‘reassess situation’. Sam: Reassess situation. OK. Aaron: Yeah, and then, of course, there are two outcomes from the reassessment. Pass or fail. Either the child’s been successful or he hasn’t. If the reas"],["eng","dse","答案",51,"Announcer: Task 4. Your group has completed its research and you are presenting your findings to your classmates. Listen to the end of your presentation and the question and answer session. Complete the information below as you listen. You now have one minute to study the information. At the end of the task, you will have 2 minutes to tidy up your answers. (1 minute of Greensleeves) (Tone) Sam: So, I’d like to hand you over to Lucy now, who’s going to go through our recommendations. Lucy: Thank you Sam. Right, so, our recommendations. Sam’s spoken about the problems suffered by children who are either overweight or obese…uh... There are a number of things that we think we can do to help these children. I mean, it’s all very well advocating a healthy diet and more exercise. These are expected and schools should be promoting these anyway. What we would like to see is a programme of visits "],["eng","dse","答案",52,"Student 2: Who me? OK. Yeah. Thanks. To tell you the truth, I was a bit disappointed with your presentation. When I saw the title of your talk I thought, ‘Yeah, this could be quite interesting.’ But unless I missed something as I drifted off, you didn’t actually say anything new in the end. We’ve heard it all before. You have my sympathy if you weren’t given a choice and were told by Mr. Johnson to do this topic, ‘cause I’d imagine there is nothing new you can say about children with weight problems. I mean, you’ve probably done a better job than I could have with the same topic, but I just found it all a bit dull. I dunno. Aaron: Mmm. (laughs nervously) Right. OK. Not sure if I know how to answer that one actually. Erm… Lucy: OK, maybe we could just move on. Does anyone else have a question or a comment? Student 3: Thanks. I’d like to thank the group for an excellent presentation but I "],["eng","dse","答案",53,"Announcer: Part B. Situation. You are Pat Lee. You work in the Campus Services Department at Hong Kong Metropolitan University. You are an assistant to Donnie Kwok, the manager in charge of all the different restaurants on the campus. You will listen to a recording of part of a meeting of the Campus Services Committee, where they discuss some issues regarding food and drink on the campus. Before the recording is played, you will have five minutes to study the Question-Answer Book and the Data File for Part B1 and the Question-Answer Book and the Data File for Part B2. Remember you must choose to do the tasks in either Part B1 or Part B2. Do not attempt both Parts B1 and B2. Complete the tasks by following the instructions in the Question-Answer Book that you choose and on the recording. You will find all the information you need in the Question-Answer Book and Data File that you choose a"],["eng","dse","答案",54,"YY: But people get ill for all sorts of reasons. Donnie: True, but the doctor at the university clinic said it was food poisoning. Chair: Food poisoning? That’s serious. So how do they think that she got food poisoning? Donnie: Well, seemingly the likely cause is the smoked salmon she had in her sandwich. You know, salmon can be a real problem. I mean, if it’s not kept properly, it can easily go bad. Chair: Yeah. So have you carried out any follow-up action? Have you checked the Coffee Shop? Donnie: Yes, we carried out an inspection of the Coffee Shop on Monday the Ninth of January and – Chair: You mean yesterday? Donnie: Yeah sorry, We carried out an inspection of the Coffee Shop yesterday, the Ninth of January, and we found that the ingredients for the sandwiches, like the smoked salmon, the meat, tomatoes, lettuce, that kind of thing, were kept for long periods of time out of the frid"],["eng","dse","答案",55,"Brenda: You’re right. We obviously need to do something. Donnie: Yeah, well, I’ve been in touch with the Manager, Oliver Rogers about all of this, and I’ll be informing him of the results of our inspection and telling him that improvements need to be made. Chair: And what else can we do if he doesn’t make these improvements? If things don’t get better? Donnie: If these improvements aren’t made, I suggest we tell him we will not renew his contract. Chair: Oliver Rogers, you mean? Donnie: Yeah. Brenda: Yes, I agree. Chair: Well, that seems to be clear then. If the Coffee Shop doesn’t improve, we won’t be renewing Oliver Rogers’ contract. Can you inform Oliver Rogers about our feelings, Donnie? Donnie: Yes. We can send him an email today. Chair: OK, good. Let’s see how it goes then. OK, let’s move onto the next item on the agenda. The Eat Yourself Fitter Week. How’s the preparation coming a"],["eng","dse","答案",56,"Chair: OK. Donnie: We asked Antonia Zacha if she would like to give the lecture. Chair: Who? YY: You know Antonia Zacha, the owner of the new restaurant on campus. Chair: No. You’ve lost me. YY: Antonia. Zacha. Z-A-C-H-A. She’s opening the new restaurant at the university. Chair: Oh, Sorry, I know. Antonia Zacha. The Chef. Right. So is she going to do a lecture, then? Donnie: Yes. She was actually really keen. She’s actually keen to help in any way she can in the Eat Yourself Fitter Week. Chair: Well, let’s try to get her involved. When’s her lecture on again? Donnie: OK, we’ve booked the room already. Just let me find it… OK, yeah, – Thursday March the 8th. At 1.00 pm. And she’ll be talking in Lecture Room 14b. The title of her lecture is ‘Eating on a Budget’. Chair: Right, let me make a quick note of that. Antonia Zacha, Eating on a Budget. Thursday the 8th at 1 o’clock. Donnie: Oh, an"],["eng","dse","答案",57,"只限教師參閱 FOR TEACHERS’ USE ONLY 香港考試及評核局 HONG KONG EXAMINATIONS AND ASSESSMENT AUTHORITY 香港中學文憑考試 HONG KONG DIPLOMA OF SECONDARY EDUCATION EXAMINATION 練習卷 PRACTICE PAPER ENGLISH LANGUAGE PAPER 4 評卷參考(暫定稿) PROVISIONAL MARKING SCHEME 本評卷參考乃香港考試及評核局專為本科練習卷而編寫，供教師參 考之用。教師應提醒學生，不應將評卷參考視為標準答案，硬背死 記，活剝生吞。這種學習態度，既無助學生改善學習，學懂應對及 解難，亦有違考試着重理解能力與運用技巧之旨。因此，本局籲請 各位教師通力合作，堅守上述原則。 This marking scheme has been prepared by the Hong Kong Examinations and Assessment Authority for teachers’ reference. Teachers should remind their students NOT to regard this marking scheme as a set of model answers. Our examinations emphasise the testing of understanding, the practical application of knowledge and the use of processing skills. Hence the use of model answers, or anything else which encourages rote memorisation, will not help students to improve their learning nor develop their abilities in addressing and solvin"],["eng","dse","答案",58,"只限教師參閱 FOR TEACHERS’ USE ONLY Provisional Marking Scheme General Notes for Teachers on Marking 1. Adherence to marking scheme This marking scheme is the preliminary version before the normal standardisation process and some revisions may be necessary after actual samples of performance have been collected and scrutinised by the HKEAA. Teachers are strongly advised to conduct their own internal standardisation procedures before applying the marking schemes. A ","答案",45,"家 明： 這 和《特 洛伊 戰爭》 有什 麼關係 ？ 芳 芳： 為了守諾言，維納斯迷惑了斯巴達王后海倫，讓她跟帕里斯私奔。斯巴達國王很忿怒，他 聯合其他城邦，一起攻打特洛伊。天后赫拉和雅典娜因為妒忌，便幫助希臘人，最終以木 馬 屠城結 束了 這場十 年的 戰爭。 美 儀： 神 話和歷 史有 什麼關 係？ 芳 芳： 這一本書《神話研究》分析了神話產生的原因，其中一種學說「神話史實說」便和歷史有 關。 美 儀： 什 麼是「 神話 史實說 」？ 芳 芳： 這種說法指神話敍述的其實是歷史事件，只是在流傳中被扭曲或誇張了。持這種看法的人 認 為研究 神話 可以幫 助我 們瞭解 遠古 歷史。 家 明： 不 知道中 國有 沒有和 歷史 事件有 關的 神話呢 ？ 美 儀： 我記起來了，歷史書中記載了黃帝在阪泉大戰蚩尤，而神話更說黃帝追殺蚩尤到阪泉，忽 然狂風大作，濃霧瀰漫。原來蚩尤用了妖術，令黃帝的士兵迷失方向。幸好，黃帝發明了 「 指南車 」， 分辨方 向作 戰，最 終把 蚩尤殺 了。 可是， 這是 否真有 其事 ，卻令 人懷 疑。 家 明： 黃 帝發明 「指 南車」 ，這 正正是 對歷 史的補 充說 明。 美 儀： 家 明，「 指南 車」由 誰發 明，還 不能 確定呢 ！芳 芳，神 話的 產生還 有其 他原因 嗎？ 芳芳： 也有學者認為，神話是先民把自然現象擬人化的產物。王老師不是說過「共工」的神話 嗎？ 美 儀： 對。水神「共工」和火神「祝融」打架，「共工」輸了，便把西邊的天柱不周山撞斷，天 便 塌了下 來。 這個故 事正 好解釋 了中 國的地 勢西 邊高東 邊低 ，而江 河則 從西向 東流 。 家 明： 怪 不得古 人的 詩詞總 是說 「自是 人生 長恨水 長東 」。 美 儀： 芳 芳，不 知道 希臘有 沒有 這類神 話？ 芳 芳： 希臘神話也有。話說穀物女神是春天女神的母親，她主管大地一切植物的枯榮。有一天， 她的女兒被冥神拐到地府作妻子，她找遍大地也找不到女兒，由於太過傷心，便收回恩 澤，令大地的農作物都枯萎了。最後，天帝宙斯出面調解，冥神答應每年的上半年讓春天 女 神 和"],["chi","dse","答案",46,"芳 芳： 對。后稷是周朝的始祖，相傳他的母親姜原在野外踏過巨人的足印後，便懷了孕。后稷剛 生下來時，姜原以為他會帶來不祥，便把兒子拋棄在巷子中，可是牛馬經過都避開了，怕 踩傷了他；姜原又把兒子拋棄在寒冰上，飛鳥卻用翅膀來為他保溫。姜原知道上天保佑兒 子 後，便 不敢 再拋棄 他， 更取名 叫「 棄」， 「棄 」長大 後， 便是周 的始 祖后稷 。 美 儀： 怪 不得古 今中 外，不 少民 族和部 落都 有先祖 的神 話和傳 說。 家 明： 《 特洛伊 戰爭 》這神 話， 最終希 臘軍 隊戰勝 了特 洛伊， 也隱 喻希臘 政權 得到神 祇庇 佑。 美 儀： 看 來神話 蘊藏 了不少 學問 。 芳 芳： 美 儀，不 如跟 我和家 明一 起蒐集 報告 的資料 ，好 嗎？ 美 儀： 好 啊。 現 在請用 4分鐘 整理答 案。 PP-DSE-CH LANG 3–4"],["chi","dse","答案",47,"第 二段 錄音 嘉 嘉： 各位同學，我是何嘉嘉，在劇中飾演愛神維納斯。感謝各位到來欣賞這場特別為學界演出 的 話 劇 《 特 洛 伊 戰 爭 》 。 接 下 來 的 環 節 ， 是 讓 觀 和 演 員 交 流 。 同 學 可 以 舉 手 發 問 ， 或 者 把 問題寫 下交 給工作 人員 。 景 恆： 各位同學好，我是周景恆，飾演帕里斯，這個環節由我和嘉嘉主持。嘉嘉，今天我很感 動。 嘉 嘉： 我也有同感。戲劇說不上很受年青人歡迎，所以今天那麼多同學出席實在難得。景恆，為 什 麼今天 會座 無虛席 ？ 景 恆： 我 當然知 道。 嘉 嘉： 是 什麼緣 故？ 景 恆： 因 為學生 特別 場是免 費的 。各位 同學 ，對不 對？ 觀 ： (笑 聲…… ) 景 恆： 還 有，學 校為 了鼓勵 同學 多參與 文化 活動， 聽說 可用門 票存 根換分 數。 觀 ： (笑 聲…… ) 嘉 嘉： 用 門票存 根換 什麼？ 景 恆： 好 像是中 文科 校本評 核的 分數。 嘉 嘉： 景 恆，我 還以 為是因 為大 家喜歡 話劇 呢。我 們真 是自作 多情 啊！ 景 恆： 自 作多情 也不 成問題 ，希 望各位 同學 在接觸 話劇 後，對 話劇 產生興 趣便 好了。 嘉 嘉： 對 。各位 同學 ，你們 喜不 喜歡這 齣話 劇？ 觀 ： 喜 歡。 嘉 嘉： 景 恆，不 如看 看同學 們有 什麼問 題， 好嗎？ 景 恆： 好。 芳 芳： 兩 位好， 我是 芳芳。 你們 演這齣 話劇 要面對 什麼 挑戰和 困  第 (1)題 到 第 (6)題 的 答 案 。 第二段錄音 李雪兒： 我也反對王一心同學的建議，我反對的原因和張學長不同，我認為這個花園，特 別是花園中的涼亭，其實是學校歷史的一個重要部分。 王一心： 李同學，你的說法是否有點誇張？這不過是一個平平無奇的涼亭和小花園，和學 校歷史有什麼關係？ 李雪兒： 王同學，你有所不知了。我翻閱歷史學會有關校史的檔案，發現在過去四十年， 每 一 屆 的 學 生 會 幹 事 會 成 立 後，都 會 在 涼 亭  會 一 次，叫 作「 新 人 亭  」；而 且 每 年的畢業生在留校的最後一天，都會在涼亭拍照留念。 張家傑： 不僅這樣，我記得校長還會特意來到涼亭，與我們畢業生握手道別！ 王一心： 那又怎樣，那也算是歷史價值嗎？每一屆學生會幹事會成立，還不是在小食部舉 行慶祝會嗎？每一年畢業生在校的最後一天，不也在自己的班房中拍照嗎？那些 不是歷史嗎？那麼，每個課室也是歷史遺物了！ "],["chi","dse","卷三",11,"李 雪 兒 ： 沒 錯，就 是 那 一 聯：「 後 會 有 期，此 後 莫 忘 今 日 語；前 程 無 限，向 前 須 問 過 來 人。」 這一聯既切合亭本來的意思，又帶出了學校薪火相傳的含意，用在小涼亭上，真 的貼切！ 王一心： 「亭」字本來有什麼意思？ 李雪兒： 「亭」這個字，本來就有「停下來」的意思，亭在古代是行人休息的地方，所以 「涼亭」的「亭」，與「停止」的「停」，本來的意思是一樣的。 王一心： 那和對聯有什麼關係？ 李 雪 兒 ： (不 屑 語 氣 )和 你 談 這 些 ， 真 的 對 牛 彈 琴 ！ 「 後 會 有 期 」 ， 正 正 是 指 亭 中 人 即 將 離 去，可是不要忘記了送別者的贈言。 王一心： 那「前程無限」又有何意思？ 李雪兒： 這個亭，同時也可以象徵學校。我們不是一同在學校中停留了一段日子嗎？離開 後，師長的教誨，不就是「今日語」嗎？若要「前程無限」，不是要知道過來人 的人生經驗嗎？所以「向前須問過來人」，就是這個意思！王一心同學，你還老 是說以假代真，你對涼亭的歷史一無所知，就要把涼亭和小花園拆掉，真的是膽 大妄為！ 王一心： 好了好了，就算這個涼亭真的那麼珍貴，值得保留，也不應該保留在學校大門附 近這麼重要的地點，就把它移去學校其他的角落，不就解決了問題嗎？ 李 雪 兒 ： 這 又 要 再 談 談 有 關 中 國 建 築 的 特 色。中 國 園 林 中 往 往 都 設 有 亭，如 西 湖 的 湖 心 亭。 這些亭都有一個共同的特點，就是作為整個景色的核心，如「畫龍點睛」一般， 令整個園林生動起來。 由此我們可以推想到，當初學校興建之時，會把這個亭放在學校大門附近，正正 代表這個亭可以顯現學校的理念。故此，王一心同學，亭不是說搬就搬的！ 王一心： 我並不否定涼亭的歷史及文化價值，但是兩位好似完全和時代脫節，完全沒有顧 及學校的整體發展。現實是：學校地方不足！我個人同意保留小涼亭，可是保留 也有很多方法，不如在新建的多用途大樓，闢一個地方，展示涼亭，不就皆大歡 喜嗎？ 李雪兒： 這做法，就是把本來和我們學校生活有密切聯繫的歷史文物，變成"],["chi","dse","卷三",12,"第三段錄音 陳思華： 究竟什麼是歷史價值？同時，保留具歷史價值的建築物，與發展學校空間之間， 又如何取捨呢？很高興今天能和歷史科的何老師談談這個問題。本來的計劃是與 三位參與討論的同學一起訪問的，可惜李雪兒和張家傑校友有事須先行離開。現 在就由我，陳思華和王一心同學「主持大局」了。何老師，我們首先想問的是： 什麼是歷史價值？ 何老師： 從以下例子，我們比較容易明白什麼是歷史價值： 如果不幸地，你家發生火災，你倆即時想到要帶走什麼東西？ 王一心： 當然就是身分證了。 何老師： 王一心同學，這是否因為身分證有實際作用？ 王一心： 對呀。 何老師： 那麼，陳思華同學你又如何？ 陳思華： 有些人會帶身分證、錢；也有人會帶相簿、成績表，因為這些東西都是獨一無二 的 。 唔 …… 我 想 我 會 帶 走 日 記 。 何老師： 為什麼？ 陳思華： 日記可說是獨一無二的。 王一心： 如果沒有身分證便麻煩了，辦補領手續也很麻煩。 陳思華： 如果你的日記燒掉了，雖然對日常生活的影響不大，但是失去的記憶卻是無可取 代的。那何老師您呢？ 何老師： 我既不會帶身分證，也不會帶日記，只會帶我的結婚相簿，我十分重視婚姻！不 過，從你倆的選擇中，已經說出了在你們的心目中，歷史價值的發展空間，何者 較為重要了。不過，這個選擇是屬個人的層面理解，而從社會以至國家的層面來 看，就會複雜得多。 王一心： 我們有說明嗎？為什麼我不明白呢？好了，老師你還說到，個人與社會對歷史價 值的理解會有所分
