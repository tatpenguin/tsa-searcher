let cur="all";
const bar=document.getElementById("bar"),list=document.getElementById("list"),q=document.getElementById("q");
const subs=["all","chi","eng","m0","m1","m2"];
bar.innerHTML=subs.map(s=>`<div class="chip${s==="all"?" on":""}" data-s="${s}">${s==="all"?"全部":NAME[s]} (${s==="all"?D.length:D.filter(r=>r.s===s).length})</div>`).join("");

q.oninput=draw;
function draw(){const kw=q.value.trim().toLowerCase();

 list.innerHTML=rows.length?rows.map(r=>`<div class="row"><div class="meta"><div class="t1">${NAME[r.s]}・${r.y}・${r.k}</div><div class="t2">${r.f} ・ ${r.mb} MB</div></div><a class="dl" href="${r.u}" target="_blank" rel="noopener">開啟</a></div>`).join(""):'<div class="row">冇符合結果</div>';
}
